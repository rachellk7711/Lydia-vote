<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루디아 모임 투표</title>
  <!-- 폰트 및 스타일 -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #FAF9F6; font-family: 'Noto Sans KR', sans-serif; color: #333; }
    h1, h2, .myeongjo { font-family: 'Nanum Myeongjo', serif; color: #6A2C3E; }
    .btn-burgundy { background-color: #6A2C3E; color: white; transition: 0.2s; }
    .btn-burgundy:hover { background-color: #50202e; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e5e5e5; overflow: hidden; }
    .leaf-bg { background-image: url('https://www.transparenttextures.com/patterns/rice-paper.png'); }

    /* ── 투표 화면: 사진들이 한 줄로 천천히 흘러가는 컨베이어 벨트 효과 ── */
    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ── 최종 후보 발표 화면: 가을 분위기 장식 ── */
    .finale-divider { width: 140px; height: 2px; margin: 0 auto 2.5rem auto; background: linear-gradient(90deg, transparent, #c9a24b, transparent); }
    .finale-card {
      background: linear-gradient(180deg, #fffdf9 0%, #fdf3e4 100%);
      border: 1px solid #e8d4ad;
      border-radius: 18px;
      box-shadow: 0 16px 32px rgba(106,44,62,0.16);
      overflow: visible;
    }
    .falling-leaf { position: absolute; top: -10%; opacity: 0; animation: leafFall linear infinite; will-change: transform, opacity; pointer-events: none; }
    @keyframes leafFall {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      8%   { opacity: 0.65; }
      50%  { transform: translateY(55vh) translateX(30px) rotate(180deg); }
      92%  { opacity: 0.65; }
      100% { transform: translateY(115vh) translateX(-25px) rotate(360deg); opacity: 0; }
    }
  </style>
  
  <!-- Firebase & React 라이브러리 -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  
  <!-- 데이터 백업용(ZIP, CSV) 라이브러리 추가 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="leaf-bg min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    // 1. Firebase 연결 설정
    const firebaseConfig = {
      apiKey: "AIzaSyD97cKjoQdv-4y-NNu4-ctU7vTnL2SVxOY",
      authDomain: "lydia-vote.firebaseapp.com",
      projectId: "lydia-vote",
      storageBucket: "lydia-vote.firebasestorage.app",
      messagingSenderId: "547959381518",
      appId: "1:547959381518:web:3818272fd8cced153b265f"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 입력된 생년월일 포맷 함수
    const formatName = (birth, name) => {
      let yy = String(birth || '').replace(/[^0-9]/g, '');
      if (yy.length === 8) yy = yy.substring(2, 4); 
      else if (yy.length >= 6) yy = yy.substring(0, 2); 
      else if (yy.length === 4) yy = yy.substring(2, 4); 
      else yy = yy.substring(0, 2); 
      return `[${yy} ${name}]`;
    };

    // ★ 투표 중일 때 대형 스크린에 표시되는 '스크린세이버' 애니메이션 컴포넌트
    const FloatingCards = ({ candidates }) => {
      if (candidates.length === 0) {
        return (
          <div className="fixed inset-0 overflow-hidden flex items-center justify-center" style={{ backgroundColor: '#FAF9F6' }}>
            <h2 className="text-6xl font-bold text-gray-300 opacity-40 myeongjo tracking-widest text-center leading-relaxed">
              지금은 투표 중입니다<br/>스마트폰에서 소중한 한 표를 행사해 주세요
            </h2>
          </div>
        );
      }

      // 두 줄로 나눠 서로 반대 방향으로 흐르게 함 (짝/홀수 인덱스로 분배)
      const row1 = candidates.filter((_, i) => i % 2 === 0);
      const row2 = candidates.filter((_, i) => i % 2 === 1);
      // 각 줄이 비지 않도록, 인원이 적어 한쪽이 비면 전체 명단으로 대체
      const safeRow1 = row1.length > 0 ? row1 : candidates;
      const safeRow2 = row2.length > 0 ? row2 : candidates;
      // 끊김없이 반복되도록 각 줄의 명단을 두 번 이어붙임
      const track1 = [...safeRow1, ...safeRow1];
      const track2 = [...safeRow2, ...safeRow2];
      // 인원 수에 비례해 재생 시간을 정해서, 인원이 많아져도 한 사람당 흐르는 속도는 일정하게 유지 (기존보다 빠르게)
      const speed = (list) => Math.max(3, list.length * 0.9);

      // 컴포넌트로 따로 빼지 않고 함수로 JSX만 반환 — 투표로 candidates가 바뀔 때마다
      // 새 컴포넌트 타입으로 리마운트되어 애니메이션이 처음으로 튕기는 것을 방지
      const renderRow = (track, duration, reverse) => (
        <div style={{ overflow: 'hidden' }}>
          <div
            className="flex items-start"
            style={{
              animationName: 'marquee',
              animationDuration: `${duration}s`,
              animationTimingFunction: 'linear',
              animationIterationCount: 'infinite',
              animationDirection: reverse ? 'reverse' : 'normal',
              willChange: 'transform',
            }}
          >
            {track.map((c, i) => (
              <div
                key={i}
                className="card p-3 text-center bg-white shadow-2xl border-2 border-gray-100"
                style={{ width: '320px', flex: '0 0 auto', marginRight: '2rem' }}
              >
                <img src={c.photo} className="w-full h-72 object-cover rounded mb-3 pointer-events-none" />
                <p className="text-xl font-bold">{formatName(c.birth, c.name)}</p>
              </div>
            ))}
          </div>
        </div>
      );

      return (
        <div className="fixed inset-0 overflow-hidden flex flex-col items-center justify-center" style={{ backgroundColor: '#FAF9F6' }}>
          {/* 배경의 은은한 안내 문구 */}
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none" style={{ zIndex: 0 }}>
            <h2 className="text-6xl font-bold text-gray-300 opacity-40 myeongjo tracking-widest text-center leading-relaxed">
              지금은 투표 중입니다<br/>스마트폰에서 소중한 한 표를 행사해 주세요
            </h2>
          </div>

          {/* 사진들이 두 줄로 서로 반대 방향으로 천천히 흘러가는 컨베이어 벨트 효과 */}
          <div style={{ position: 'relative', zIndex: 1, width: '100%' }}>
            <div style={{ marginBottom: '2rem' }}>
              {renderRow(track1, speed(safeRow1), false)}
            </div>
            {renderRow(track2, speed(safeRow2), true)}
          </div>
        </div>
      );
    };

    // ★ 최종 후보 발표 화면에 은은하게 떨어지는 낙엽 장식 (마우스/터치 입력을 가로막지 않음)
    const FallingLeaves = () => {
      const leaves = React.useMemo(() => {
        const emojis = ['🍁', '🍂', '🍃'];
        return Array.from({ length: 16 }).map((_, i) => ({
          id: i,
          emoji: emojis[i % emojis.length],
          left: Math.random() * 100,
          size: 18 + Math.random() * 16,
          duration: 9 + Math.random() * 9,
          delay: -Math.random() * 18,
        }));
      }, []);
      return (
        <div className="fixed inset-0 overflow-hidden" style={{ pointerEvents: 'none', zIndex: 0 }}>
          {leaves.map(l => (
            <span
              key={l.id}
              className="falling-leaf"
              style={{ left: `${l.left}%`, fontSize: `${l.size}px`, animationDuration: `${l.duration}s`, animationDelay: `${l.delay}s` }}
            >{l.emoji}</span>
          ))}
        </div>
      );
    };

    // 2. 메인 앱 컴포넌트
    function App() {
      const [view, setView] = React.useState('mobile'); 
      const [status, setStatus] = React.useState('register'); 
      const [candidates, setCandidates] = React.useState([]);
      const [hasVoted, setHasVoted] = React.useState(localStorage.getItem('lydia_voted') === 'true');
      const [photoData, setPhotoData] = React.useState(null);
      const [isSubmitting, setIsSubmitting] = React.useState(false);

      React.useEffect(() => {
        const hash = window.location.hash;
        if(hash === '#admin') setView('admin');
        else if(hash === '#screen') setView('screen');
        
        db.collection("settings").doc("appStatus").onSnapshot(doc => {
          if(doc.exists) setStatus(doc.data().current);
          else db.collection("settings").doc("appStatus").set({ current: 'register' });
        });

        db.collection("candidates").orderBy("timestamp", "asc").onSnapshot(snapshot => {
          const list = [];
          snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
          setCandidates(list);
        });
      }, []);

      const handleFileSelect = (file) => {
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 800; // 800픽셀보다 클 때만 축소 (작은 사진은 억지로 키우지 않음)
            const scaleSize = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
            canvas.width = img.width * scaleSize;
            canvas.height = img.height * scaleSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            setPhotoData(canvas.toDataURL('image/jpeg', 0.8)); // 화질 80%
          }
          img.src = event.target.result;
        }
        reader.readAsDataURL(file);
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        if(isSubmitting) return; // 연타로 인한 중복 등록 방지

        const name = e.target.name.value;
        const birth = e.target.birth.value;
        const calendar = e.target.calendar.value;
        const isEarly = e.target.isEarly.checked;

        if(!photoData) return alert("카메라로 촬영하거나 앨범에서 사진을 먼저 선택해 주세요.");
        if(!name || !birth) return alert("이름과 생년월일을 입력해 주세요.");

        setIsSubmitting(true);
        db.collection("candidates").add({
          photo: photoData, name, birth, calendar, isEarly, votes: 0, timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
          alert("등록되었습니다! 추가 등록도 가능합니다.");
          e.target.reset();
          setPhotoData(null);
        }).catch((err) => {
          console.error(err);
          alert("등록에 실패했습니다. 네트워크 상태를 확인하고 다시 시도해 주세요.");
        }).finally(() => {
          setIsSubmitting(false);
        });
      };

      const handleVote = (id) => {
        if(hasVoted) return alert("이미 투표하셨습니다.");
        if(confirm("이 분에게 투표하시겠습니까?")) {
          db.collection("candidates").doc(id).update({
            votes: firebase.firestore.FieldValue.increment(1)
          }).then(() => {
            localStorage.setItem('lydia_voted', 'true');
            setHasVoted(true);
            alert("투표가 완료되었습니다.");
          });
        }
      };

      // --- 화면 1: 모바일 참가자 화면 ---
      if (view === 'mobile') {
        return (
          <div className="max-w-md mx-auto p-5">
            <h1 className="text-2xl text-center font-bold mb-2">🍂 마음과 마음을 잇는 따뜻한 자리, 루디아</h1>
            {status === 'register' && (
              <div className="card p-6 mt-6">
                <h2 className="text-xl text-center mb-6 font-bold">회원 등록을 진행해 주세요</h2>
                <form onSubmit={handleRegister} className="flex flex-col gap-4">
                  
                  <div className="flex gap-2">
                    <label className="flex-1 cursor-pointer border-2 border-dashed border-gray-400 p-4 rounded-lg text-center bg-white hover:bg-gray-50 transition">
                      <span className="text-3xl block mb-2">📸</span>
                      <span className="text-gray-700 font-bold text-sm">카메라로 촬영</span>
                      <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleFileSelect(e.target.files[0])} />
                    </label>
                    <label className="flex-1 cursor-pointer border-2 border-dashed border-gray-400 p-4 rounded-lg text-center bg-white hover:bg-gray-50 transition">
                      <span className="text-3xl block mb-2">🖼️</span>
                      <span className="text-gray-700 font-bold text-sm">앨범에서 선택</span>
                      <input type="file" accept="image/*" className="hidden" onChange={(e) => handleFileSelect(e.target.files[0])} />
                    </label>
                  </div>

                  {photoData && (
                    <div className="text-center mt-2">
                      <p className="text-sm text-green-600 font-bold mb-2">✅ 사진이 잘 들어갔습니다</p>
                      <img src={photoData} className="w-32 h-32 object-cover mx-auto rounded-full border-2 border-gray-300" />
                    </div>
                  )}
                  
                  <input type="text" name="name" placeholder="이름 (예: 루디아)" className="border p-3 rounded mt-2" required />
                  <input type="number" name="birth" placeholder="생년월일 6자리 (예: 700101)" className="border p-3 rounded" required />
                  
                  <div className="flex justify-around items-center border p-3 rounded bg-white text-gray-700">
                    <label className="flex items-center gap-2 cursor-pointer"><input type="radio" name="calendar" value="양력" defaultChecked className="w-4 h-4" /> 양력</label>
                    <label className="flex items-center gap-2 cursor-pointer"><input type="radio" name="calendar" value="음력" className="w-4 h-4" /> 음력</label>
                    <div className="w-px h-5 bg-gray-300"></div>
                    <label className="flex items-center gap-2 font-bold text-indigo-600 cursor-pointer"><input type="checkbox" name="isEarly" className="w-4 h-4" /> 빠른</label>
                  </div>

                  <button type="submit" disabled={isSubmitting} className="btn-burgundy font-bold p-4 rounded text-lg mt-2 disabled:opacity-50">{isSubmitting ? '등록 중...' : '🌸 회원 등록하기'}</button>
                </form>
              </div>
            )}
            {status === 'voting' && (
              <div>
                <p className="text-center mb-4 text-gray-600">1인 1표, 소중한 한 표를 행사해 주세요.</p>
                <div className="grid grid-cols-2 gap-4">
                  {candidates.map(c => (
                    <div key={c.id} className="card p-2 text-center" onClick={() => handleVote(c.id)}>
                      <img src={c.photo} className="w-full h-32 object-cover rounded mb-2" />
                      <p className="font-bold text-lg">{formatName(c.birth, c.name)}</p>
                      <button className="w-full btn-burgundy text-white text-sm py-2 rounded mt-2">투표하기</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {status === 'finished' && (
              <div className="text-center mt-20">
                <h1 className="text-3xl mb-4">🎉 투표 종료</h1>
                <p>결과는 앞쪽 스크린을 확인해 주세요!</p>
              </div>
            )}
          </div>
        );
      }

      // --- 화면 2: 대형 스크린 (노트북용) ---
      if (view === 'screen') {
        // 최종 후보는 더 이상 득표수로 자동 계산하지 않고, 관리자가 선정한 사람을 그대로 표시 (동률 시 인원 조정 가능)
        // 순위는 비공개 항목이므로 득표수 순이 아닌 이름순으로 표시
        const finalists = candidates
          .filter(c => c.finalist)
          .sort((a,b) => (a.name || '').localeCompare(b.name || '', 'ko'));

        return (
          <div className="p-10 max-w-6xl mx-auto">
            {/* 등록 모드일 때 (멈춰있는 갤러리 뷰) */}
            {status === 'register' && (
              <div>
                <h1 className="text-5xl text-center mb-12 border-b border-gray-300 pb-6">🍂 아름다운 동행, 루디아 회원 명단</h1>
                <div className="grid grid-cols-5 gap-6">
                  {candidates.map(c => (
                    <div key={c.id} className="card p-3 text-center">
                      <img src={c.photo} className="w-full h-48 object-cover rounded mb-3" />
                      <p className="text-2xl font-bold">{formatName(c.birth, c.name)}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 투표 모드일 때 (스크린세이버 효과) */}
            {status === 'voting' && (
              <FloatingCards candidates={candidates} />
            )}

            {/* 투표 종료 결과 발표 (관리자가 선정한 최종 후보) — 가을 분위기 연출 */}
            {status === 'finished' && (
              <div style={{ position: 'relative', minHeight: 'calc(100vh - 5rem)', display: 'flex', flexDirection: 'column' }}>
                <FallingLeaves />
                <div style={{ flex: 1 }}></div>
                <div style={{ position: 'relative', zIndex: 1 }}>
                  {finalists.length > 0 ? (
                    <div className="text-center">
                      <p style={{ fontSize: '1.5rem', letterSpacing: '1rem', marginBottom: '0.5rem', opacity: 0.8 }}>🍁 🍂 🍁</p>
                      <h2 className="text-5xl mb-4">2027년 총무 후보입니다!</h2>
                      <div className="finale-divider"></div>
                    </div>
                  ) : (
                    <h2 className="text-2xl text-center mb-10 mt-6 text-gray-400">관리자 화면에서 최종 후보를 선정해 주세요</h2>
                  )}
                  {/* max-w-6xl 부모를 벗어나 화면 전체 폭을 써서, 인원수와 상관없이 한 줄로 표시 */}
                  {/* (쓰고 있는 Tailwind CDN이 구버전 사전 컴파일 CSS라 대괄호 임의값 클래스가 적용되지 않아 인라인 스타일로 처리) */}
                  <div style={{ position: 'relative', left: '50%', width: '100vw', marginLeft: '-50vw', paddingLeft: '2.5rem', paddingRight: '2.5rem', boxSizing: 'border-box' }}>
                    <div className="flex flex-nowrap justify-center items-start gap-6 mt-10">
                      {finalists.map((c) => (
                        <div key={c.id} className="finale-card p-5 text-center" style={{ position: 'relative', flex: '1 1 0%', minWidth: 0, maxWidth: '300px' }}>
                          <img src={c.photo} className="w-full object-cover mb-4 mt-1" style={{ aspectRatio: '1 / 1', borderRadius: '12px' }} />
                          <p className="text-2xl font-bold truncate" style={{ color: '#6A2C3E' }}>{formatName(c.birth, c.name)}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
                <div style={{ flex: 2 }}></div>
              </div>
            )}
          </div>
        );
      }

      // --- 화면 3: 관리자 대시보드 ---
      if (view === 'admin') {
        const handleDownloadCSV = () => {
          if (candidates.length === 0) return alert("등록된 데이터가 없습니다.");
          // 쉼표나 따옴표가 들어있는 값도 깨지지 않도록 각 칸을 큰따옴표로 감싸고 내부 따옴표는 이스케이프
          const csvField = (v) => `"${String(v || '').replace(/"/g, '""')}"`;
          const csvContent = "data:text/csv;charset=utf-8,\uFEFF"
            + "이름,생년월일,양/음,빠른\n"
            + candidates.map(c => [c.name, c.birth, c.calendar || '양력', c.isEarly ? 'O' : 'X'].map(csvField).join(",")).join("\n");
          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", "루디아_명단.csv");
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        };

        const handleDownloadImages = () => {
          if (candidates.length === 0) return alert("등록된 사진이 없습니다.");
          alert("사진을 압축하고 있습니다. 잠시만 기다려주세요...");
          const zip = new JSZip();
          const usedNames = {}; // 동명이인이어도 파일이 서로 덮어쓰지 않도록 이름별로 번호를 붙임
          candidates.forEach(c => {
            const base64Data = c.photo.split(',')[1];
            const count = (usedNames[c.name] = (usedNames[c.name] || 0) + 1);
            const fileName = count > 1 ? `${c.name}_${count}.jpg` : `${c.name}.jpg`;
            zip.file(fileName, base64Data, {base64: true});
          });
          zip.generateAsync({type:"blob"}).then(function(content) {
            saveAs(content, "루디아_후보사진모음.zip");
          });
        };

        // 최종 후보 선정 (득표수로 자동 확정하지 않고, 관리자가 토글로 직접 관리 — 동률 시 인원 조정 가능)
        const finalists = [...candidates].filter(c => c.finalist).sort((a,b) => b.votes - a.votes);
        const toggleFinalist = (c) => {
          db.collection("candidates").doc(c.id).update({ finalist: !c.finalist });
        };
        const handleAutoSelectTop3 = () => {
          const sorted = [...candidates].sort((a,b) => {
            if (b.votes !== a.votes) return b.votes - a.votes;
            const at = a.timestamp && a.timestamp.toMillis ? a.timestamp.toMillis() : 0;
            const bt = b.timestamp && b.timestamp.toMillis ? b.timestamp.toMillis() : 0;
            return at - bt;
          });
          const topIds = new Set(sorted.slice(0, 3).map(c => c.id));
          candidates.forEach(c => {
            const shouldBe = topIds.has(c.id);
            if (!!c.finalist !== shouldBe) db.collection("candidates").doc(c.id).update({ finalist: shouldBe });
          });
        };
        const handleGoToFinished = () => {
          if (finalists.length === 0) handleAutoSelectTop3(); // 아직 아무도 선정 안 했으면 상위 3명으로 기본 채움
          db.collection("settings").doc("appStatus").set({current:'finished'});
        };

        return (
          <div className="max-w-md mx-auto p-5">
            <h1 className="text-2xl font-bold mb-4 text-center">⚙️ 관리자 대시보드</h1>

            {/* 현재 단계 표시 겸 단계 전환 버튼 — 선택된 단계만 진하게 강조해 대조시킴 (중복 표시 제거) */}
            <div className="flex gap-2 mb-6">
              <button onClick={()=>db.collection("settings").doc("appStatus").set({current:'register'})} className={`flex-1 p-3 rounded-lg text-sm font-bold transition ${status === 'register' ? 'text-white shadow-md' : 'bg-gray-100 text-gray-400'}`} style={status === 'register' ? { backgroundColor: '#6A2C3E' } : { backgroundColor: '#f3f4f6' }}>1. 등록모드</button>
              <button onClick={()=>db.collection("settings").doc("appStatus").set({current:'voting'})} className={`flex-1 p-3 rounded-lg text-sm font-bold transition ${status === 'voting' ? 'text-white shadow-md' : 'bg-gray-100 text-gray-400'}`} style={status === 'voting' ? { backgroundColor: '#6A2C3E' } : { backgroundColor: '#f3f4f6' }}>2. 투표시작</button>
              <button onClick={handleGoToFinished} className={`flex-1 p-3 rounded-lg text-sm font-bold transition ${status === 'finished' ? 'text-white shadow-md' : 'bg-gray-100 text-gray-400'}`} style={status === 'finished' ? { backgroundColor: '#6A2C3E' } : { backgroundColor: '#f3f4f6' }}>3. 결과발표</button>
            </div>

            {/* 최종 후보 선정 — 기본은 상위 3명, 동률이 생기면 ⭐ 버튼으로 직접 추가/제외 */}
            <div className="bg-white border rounded-lg p-4 mb-6">
              <div className="flex items-center justify-between mb-2">
                <p className="text-sm font-bold text-gray-700">⭐ 최종 후보 선정</p>
                <button onClick={handleAutoSelectTop3} className="text-xs bg-gray-200 px-2 py-1 rounded font-bold whitespace-nowrap ml-2">상위 3명 자동 선택</button>
              </div>
              <div className="flex flex-nowrap gap-2 overflow-x-auto" style={{ minHeight: '32px' }}>
                {finalists.length === 0 && <span className="text-xs text-gray-400 whitespace-nowrap">아직 선정된 후보가 없습니다</span>}
                {finalists.map(c => (
                  <span key={c.id} className="flex items-center gap-1 text-white text-xs font-bold pl-2 pr-1 py-1 rounded-full whitespace-nowrap flex-shrink-0" style={{ backgroundColor: '#6A2C3E' }}>
                    {formatName(c.birth, c.name)}
                    <button onClick={() => toggleFinalist(c)} className="w-4 h-4 flex items-center justify-center rounded-full hover:bg-white/20">×</button>
                  </span>
                ))}
              </div>
              <p className="text-xs text-gray-400 mt-2">현재 {finalists.length}명 선정됨</p>
            </div>

            {[...candidates].sort((a,b)=>b.votes - a.votes).map((c, i) => (
              <div key={c.id} className={`flex items-center gap-4 p-3 mb-2 rounded border shadow-sm ${c.finalist ? 'bg-yellow-50 border-yellow-300' : 'bg-white'}`}>
                <span className="font-bold text-gray-400 w-4 text-center">{i+1}</span>
                <img src={c.photo} className="w-12 h-12 object-cover rounded-full border" />
                <div className="flex-1">
                  <p className="font-bold text-lg">{formatName(c.birth, c.name)}</p>
                  <p className="text-xs text-gray-500">{c.birth} ({c.calendar || '양력'}) {c.isEarly ? '🐣 빠른' : ''}</p>
                  <p className="text-sm text-red-600 font-bold mt-1">{c.votes}표</p>
                </div>
                <button onClick={() => toggleFinalist(c)} className={`text-sm p-2 rounded ${c.finalist ? 'bg-yellow-400 text-white' : 'bg-gray-100 text-gray-400'}`}>⭐</button>
                <button onClick={()=>{ if(confirm("이 후보를 삭제할까요?")) db.collection("candidates").doc(c.id).delete(); }} className="text-red-500 text-sm p-2 bg-red-50 rounded">삭제</button>
              </div>
            ))}

            <div className="mt-8 pt-6 border-t border-gray-300">
              <p className="text-sm text-gray-500 mb-2 font-bold">💾 백업 및 초기화</p>
              
              <div className="flex gap-2 mb-3">
                <button onClick={handleDownloadCSV} className="flex-1 bg-green-600 text-white p-3 rounded font-bold text-sm">
                  📊 명단(CSV) 저장
                </button>
                <button onClick={handleDownloadImages} className="flex-1 bg-blue-600 text-white p-3 rounded font-bold text-sm">
                  📸 사진(ZIP) 저장
                </button>
              </div>
              
              <button onClick={()=>{
                if(confirm("정말 모든 데이터를 영구 삭제합니까? (삭제 전 명단과 사진을 꼭 백업해두세요!)")) {
                  candidates.forEach(c => db.collection("candidates").doc(c.id).delete());
                  alert("초기화되었습니다.");
                }
              }} className="w-full bg-red-600 text-white p-3 rounded font-bold text-lg mt-3">🚨 모든 데이터 파기</button>
            </div>
          </div>
        );
      }
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
